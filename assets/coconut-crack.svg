<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="A coconut cracked open at the top with water splashing into the air">
  <defs>
    <radialGradient id="shell" cx="36%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#b07a43"/>
      <stop offset="50%" stop-color="#7d4b22"/>
      <stop offset="100%" stop-color="#4a2a12"/>
    </radialGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#ead4b3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4f2ff"/>
      <stop offset="45%" stop-color="#5cc6f0"/>
      <stop offset="100%" stop-color="#2a95d3"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M40 50 L46 44 L52 51 L58 42 L64 50 L70 42 L76 51 L82 44 L88 50 A36 40 0 1 1 40 50 Z"/>
    </clipPath>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) { .edge { stroke: #e6c39a; } }
  </style>

  <!-- ground shadow -->
  <ellipse cx="64" cy="122" rx="30" ry="4" fill="#000" opacity="0.14"/>

  <!-- the coconut: whole shell, top broken off -->
  <g clip-path="url(#body)">
    <rect width="128" height="128" fill="url(#shell)"/>
    <!-- husk fibres -->
    <g fill="none" stroke-linecap="round" stroke-width="1.6">
      <path d="M38 64 C36 82 40 100 50 114" stroke="#4a2a12" opacity="0.35"/>
      <path d="M90 64 C92 82 88 100 78 114" stroke="#4a2a12" opacity="0.35"/>
      <path d="M50 58 C47 78 49 98 56 116" stroke="#c08a52" opacity="0.3"/>
      <path d="M78 58 C81 78 79 98 72 116" stroke="#4a2a12" opacity="0.3"/>
      <path d="M64 62 C63 82 64 102 64 118" stroke="#c08a52" opacity="0.22"/>
    </g>
    <!-- soft sheen -->
    <ellipse cx="47" cy="76" rx="7" ry="15" fill="#fff" opacity="0.12"/>
    <!-- the opening: white flesh rim around the dark hollow, water surface inside -->
    <ellipse cx="64" cy="51" rx="25" ry="8" fill="url(#flesh)"/>
    <ellipse cx="64" cy="52" rx="18" ry="5" fill="#2c1a0c"/>
    <ellipse cx="64" cy="52.6" rx="14" ry="3.4" fill="url(#water)"/>
  </g>
  <!-- shell outline (lightens on dark backgrounds) -->
  <path class="edge" d="M40 50 L46 44 L52 51 L58 42 L64 50 L70 42 L76 51 L82 44 L88 50 A36 40 0 1 1 40 50 Z"
        fill="none" stroke="#3b2412" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
  <!-- fractures running down the shell from the broken top -->
  <g fill="none" stroke="#2c1a0c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M48 57.5 L45 63 L48 67 L44 74"/>
    <path d="M45 63 L41 65"/>
    <path d="M80 57.5 L83 62 L80 67 L84 73"/>
  </g>

  <!-- water bursting up: column with a three-tipped splash crown -->
  <path d="M59 52 C59 44 58 36 57 29 C55 25 54 20 56 16 C58 19 60 21 61 21 C61 17 62 13 64 11 C66 13 67 17 67 21 C68 21 70 19 72 16 C74 20 73 25 71 29 C70 36 69 44 69 52 Z" fill="url(#water)"/>
  <!-- splash arcs spraying out of the crown -->
  <path d="M57 27 C48 18 35 20 29 38 C35 29 46 27 57 32 Z" fill="url(#water)"/>
  <path d="M71 27 C80 18 93 20 99 38 C93 29 82 27 71 32 Z" fill="url(#water)"/>
  <!-- highlights -->
  <path d="M61.5 48 C61 40 60.5 33 59.5 26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M51 23 C44 22 37 26 33 32" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>

  <!-- droplets in the air -->
  <g fill="url(#water)">
    <ellipse cx="28" cy="46" rx="2.6" ry="3.4"/>
    <ellipse cx="100" cy="46" rx="2.6" ry="3.4"/>
    <ellipse cx="40" cy="14" rx="2.2" ry="2.8" transform="rotate(-25 40 14)"/>
    <ellipse cx="88" cy="14" rx="2.2" ry="2.8" transform="rotate(25 88 14)"/>
    <ellipse cx="64" cy="4" rx="1.9" ry="2.4"/>
    <circle cx="50" cy="8" r="1.6"/>
    <circle cx="78" cy="7" r="1.6"/>
    <circle cx="22" cy="30" r="1.6"/>
    <circle cx="106" cy="30" r="1.6"/>
  </g>
</svg>
